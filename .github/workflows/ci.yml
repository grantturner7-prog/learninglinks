name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: learninglinks
          POSTGRES_PASSWORD: learninglinks
          POSTGRES_DB: learninglinks_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U learninglinks -d learninglinks_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://learninglinks:learninglinks@localhost:5432/learninglinks_test
      DATABASE_URL: postgres://learninglinks:learninglinks@localhost:5432/learninglinks_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
