/* LearningLinks clickable demo. Layout concept: the real site's "Concierge" look (blush canvas, aubergine ink, lilac
   and apricot), one guide ("Link") asking one question at a time, a map beside every list. Single, committed light look. */
:root {
  --blush: #fcf3ee; --paper: #fffdfb; --ink: #2b1730; --ink-2: #4a3550; --ink-3: #5b4560; --ink-4: #6e5a73;
  --line: #e2cdd0; --line-2: #efdfdb;
  --lilac-50: #f5f0fc; --lilac-100: #ebe3f8; --lilac-200: #dccff3; --lilac-300: #b7a0e3; --lilac-500: #7c5fba; --lilac-600: #66489e; --lilac-700: #553a8c;
  --apricot-300: #fde3cc; --apricot-400: #f7a96b; --apricot-500: #f08f45; --apricot-700: #a94a0e;
  --warn-bg: #fff0e2; --warn-ink: #7a3a0b; --bad-bg: #fdf0ef; --bad: #b42318; --ok-bg: #f1f7ee; --ok: #2f5d2a;
  --shadow: 0 1px 2px rgb(60 25 70 / .06), 0 8px 20px -10px rgb(60 25 70 / .16);
  --shadow-soft: 0 2px 4px rgb(60 25 70 / .04), 0 22px 44px -18px rgb(60 25 70 / .24);
  --font: "Plus Jakarta Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", "Heiti TC", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body { margin: 0; background: var(--blush); color: var(--ink); font-family: var(--font); line-height: 1.6; font-size: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }
h1, h2, h3 { line-height: 1.2; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
h1 { font-size: clamp(30px, 5vw, 48px); font-weight: 800; }
h2 { font-size: clamp(22px, 3vw, 28px); font-weight: 800; }
h3 { font-size: 19px; font-weight: 800; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--lilac-700); }
:focus-visible { outline: 3px solid var(--apricot-400); outline-offset: 2px; border-radius: 8px; }
.wrap { max-width: 1120px; margin: 0 auto; }
.stack > * + * { margin-top: 16px; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.grow { flex: 1 1 0; min-width: 0; }
.muted { color: var(--ink-3); }
.small { font-size: 14px; }
.tiny { font-size: 12.5px; }
.bold { font-weight: 800; }
.hide { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* demo strip */
.demo { background: var(--ink); color: #f3e3e8; margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 8px max(16px, env(safe-area-inset-left, 0px)); font-size: 13.5px; }
.demo .wrap { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.demo b { color: #fff; }
.demo .chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1.5px solid #6e5a73; background: transparent; color: #f3e3e8; border-radius: 999px; padding: 3px 12px; cursor: pointer; font-size: 13px; font-weight: 700; }
.chip[aria-pressed="true"] { background: var(--apricot-400); border-color: var(--apricot-400); color: var(--ink); }
.chip:hover { border-color: #fff; }
.demo .link { color: #fde3cc; background: none; border: 0; cursor: pointer; text-decoration: underline; font-size: 13.5px; padding: 2px 4px; }

/* header */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 14px 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 20px; color: var(--ink); text-decoration: none; background: none; border: 0; cursor: pointer; padding: 0; }
.nav { display: flex; flex-wrap: wrap; gap: 4px; margin-right: auto; }
.nav button { background: none; border: 0; cursor: pointer; padding: 8px 14px; border-radius: 999px; font-weight: 700; color: var(--ink-2); }
.nav button:hover { background: var(--lilac-50); }
.nav button[aria-current="page"] { background: var(--lilac-50); color: var(--ink); }
.lang { display: inline-flex; border: 1.5px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--paper); }
.lang button { border: 0; background: none; padding: 6px 12px; cursor: pointer; font-weight: 800; font-size: 14px; }
.lang button[aria-pressed="true"] { background: var(--lilac-700); color: #fff; }

/* buttons, tiles */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; padding: 11px 22px; font-weight: 800; cursor: pointer; border: 2px solid var(--ink); background: var(--paper); color: var(--ink); text-decoration: none; }
.btn:hover { background: var(--lilac-50); }
.btn-primary { background: var(--ink); color: #fff; box-shadow: 0 10px 20px -10px rgb(43 23 48 / .6); }
.btn-primary:hover { background: #3f2a47; }
.btn-lg { padding: 15px 28px; font-size: 17px; }
.btn[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
.btn-ghost { border-color: var(--line); }
.link-btn { background: none; border: 0; cursor: pointer; color: var(--lilac-700); font-weight: 700; text-decoration: underline; padding: 4px 0; }
.tile { text-align: left; background: var(--paper); border: 2px solid var(--line); border-radius: 22px; padding: 16px 18px; cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile:hover { border-color: var(--lilac-300); }
.tile[aria-pressed="true"], .tile.on { border-color: var(--apricot-500); background: var(--apricot-300); box-shadow: var(--shadow); }
.tile .t { font-weight: 800; font-size: 17px; }
.tile .d { color: var(--ink-3); font-size: 14.5px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }
.pill { background: var(--paper); border: 2px solid var(--line); border-radius: 999px; padding: 7px 16px; cursor: pointer; font-weight: 700; font-size: 15px; }
.pill:hover { border-color: var(--lilac-300); }
.pill[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }

/* cards */
.card { background: var(--paper); border-radius: 28px; padding: 24px; box-shadow: var(--shadow); min-width: 0; }
.card.soft { box-shadow: var(--shadow-soft); border-radius: 34px; padding: clamp(20px, 4vw, 34px); }
.card.flat { box-shadow: none; border: 1.5px solid var(--line-2); }
.notice { background: var(--warn-bg); border: 1.5px solid var(--apricot-300); color: var(--warn-ink); border-radius: 18px; padding: 12px 16px; font-size: 14.5px; }
.notice.ok { background: var(--ok-bg); border-color: #cfe3c9; color: var(--ok); }
.notice.bad { background: var(--bad-bg); border-color: #f4c6c1; color: var(--bad); }
.notice.demo-only { background: var(--lilac-50); border: 2px dashed var(--lilac-300); color: var(--ink-2); }
.badge { display: inline-block; background: var(--lilac-100); color: var(--lilac-700); border-radius: 999px; padding: 2px 11px; font-size: 13px; font-weight: 800; }
.badge.apricot { background: var(--apricot-300); color: var(--apricot-700); }
.badge.plain { background: var(--line-2); color: var(--ink-2); }
.eyebrow { text-transform: uppercase; letter-spacing: .06em; font-size: 13px; font-weight: 800; color: var(--lilac-700); }
hr { border: 0; border-top: 1.5px dashed var(--line); margin: 16px 0; }

/* forms */
label.lab { display: block; font-weight: 800; margin-bottom: 6px; }
.field { width: 100%; border: 2px solid var(--line); border-radius: 16px; padding: 11px 14px; background: var(--paper); }
.field:focus { border-color: var(--lilac-500); outline: none; box-shadow: 0 0 0 3px var(--lilac-100); }
textarea.field { min-height: 96px; resize: vertical; }
.ack { display: flex; gap: 12px; align-items: flex-start; background: var(--lilac-50); border-radius: 22px; padding: 16px; cursor: pointer; font-weight: 600; font-size: 15px; }
.ack input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--ink); flex: none; }
.err { color: var(--bad); font-weight: 700; font-size: 14.5px; }
.hint { color: var(--ink-3); font-size: 14px; }

/* guided flow */
.flow { display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .flow.has-aside { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); } }
.dots { display: flex; align-items: center; gap: 0; margin: 14px 0 6px; }
.dots i { width: 16px; height: 16px; border-radius: 50%; background: var(--line); flex: none; }
.dots i.done { background: var(--ink); }
.dots i.here { background: var(--apricot-500); box-shadow: 0 0 0 5px var(--apricot-300); }
.dots s { height: 3px; background: var(--line); flex: 1; text-decoration: none; }
.dots s.done { background: var(--ink); }
.say { display: flex; gap: 12px; align-items: flex-end; margin: 14px 0 6px; }
.say .bubble { background: var(--lilac-100); border-radius: 22px 22px 22px 6px; padding: 12px 16px; font-weight: 600; }
.flow h2.q { margin: 12px 0 14px; font-size: clamp(26px, 4vw, 38px); }
.nav-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: flex-end; margin-top: 22px; }
.receipt { position: sticky; top: 12px; }
.receipt .total { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; border-top: 2px dotted var(--lilac-300); margin-top: 12px; padding-top: 12px; }
.receipt .total b { font-size: 28px; }
.ticks { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 8px; }
.ticks li { display: flex; gap: 10px; align-items: flex-start; }
.ticks li::before { content: "✓"; color: var(--lilac-600); font-weight: 900; flex: none; }

/* hero / home */
.hero { padding: clamp(18px, 4vw, 40px) 0 10px; display: grid; gap: 22px; grid-template-columns: minmax(0, 1fr); align-items: center; }
@media (min-width: 900px) { .hero { grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); } }
.hero p.lead { font-size: 19px; color: var(--ink-2); max-width: 560px; margin-top: 14px; }
.price { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }

/* educator cards, lists */
.edu { display: flex; flex-direction: column; gap: 8px; }
.edu .nm { font-weight: 800; font-size: 18px; }
.edu .where { color: var(--ink-3); font-size: 14.5px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; color: var(--ink); flex: none; }
.listhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
.seg { display: inline-flex; border: 2px solid var(--ink); border-radius: 12px; overflow: hidden; background: var(--paper); }
.seg button { border: 0; background: none; padding: 7px 16px; font-weight: 800; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.filters { display: grid; gap: 12px; }
.layout { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .layout { grid-template-columns: 270px minmax(0, 1fr); } }

/* map */
.map { position: relative; background: radial-gradient(120% 90% at 30% 20%, #fdf7fb 0%, #efe4f1 100%); border-radius: 28px; box-shadow: var(--shadow); overflow: hidden; }
.map svg { display: block; width: 100%; height: auto; max-height: 560px; }
.map .city { fill: #fffaf6; stroke: #b7a0e3; stroke-width: .6; cursor: pointer; transition: fill .15s; }
.map .city:hover { fill: var(--lilac-100); }
.map .city.sel { stroke: var(--apricot-500); stroke-width: 1.6; }
.map .bub { cursor: pointer; }
.map .bub circle { fill: var(--lilac-600); stroke: #fff; stroke-width: 2.2; }
.map .bub text { fill: #fff; font-weight: 800; font-size: 11px; text-anchor: middle; dominant-baseline: central; pointer-events: none; font-family: var(--font); }
.map .lbl { font-size: 8.5px; fill: var(--ink); font-weight: 800; text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: #fffdfb; stroke-width: 2.4px; font-family: var(--font); }
.map .pin { cursor: pointer; }
.map .pin circle.s { fill: var(--lilac-600); stroke: #fff; stroke-width: 1.4; }
.map .pin circle.j { fill: var(--apricot-500); stroke: #fff; stroke-width: 1; }
.legend { position: absolute; left: 12px; bottom: 12px; background: var(--paper); border-radius: 16px; padding: 8px 12px; font-size: 12.5px; box-shadow: var(--shadow); display: grid; gap: 4px; }
.legend .scale { display: flex; gap: 3px; }
.legend .scale i { width: 22px; height: 9px; border-radius: 3px; }
.legend .dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
.mapnote { font-size: 13.5px; color: var(--ink-3); margin-top: 8px; }

/* wall / sample */
.wall { position: relative; }
.blur { filter: blur(5px); user-select: none; pointer-events: none; }
.wallcta { position: absolute; inset: 0; display: grid; place-items: center; padding: 12px; }
.wallcta .card { max-width: 520px; text-align: center; }

/* tables */
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th, .tbl td { text-align: left; padding: 8px 10px; border-bottom: 1.5px solid var(--line-2); vertical-align: top; }
.scroll-x { overflow-x: auto; }

/* ecpay demo page */
.ecp { max-width: 640px; margin: 0 auto; background: #fff; border: 2px solid #d7d7d7; border-radius: 10px; overflow: hidden; font-family: Arial, "Noto Sans TC", sans-serif; }
.ecp .hd { background: #222; color: #fff; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.ecp .hd b { font-size: 22px; font-style: italic; letter-spacing: -.5px; }
.ecp .bd { padding: 18px; display: grid; gap: 12px; color: #222; }
.ecp dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 18px; margin: 0; }
.ecp dt { color: #666; } .ecp dd { margin: 0; text-align: right; font-weight: 700; word-break: break-all; }
.ecp .amt { font-size: 22px; }
.ecp .methods { display: flex; flex-wrap: wrap; gap: 8px; }
.ecp .methods span { border: 1px solid #bbb; border-radius: 4px; padding: 6px 12px; background: #f3f3f3; font-size: 14px; }
.ecp .methods span.on { background: #fff; border-color: #2a6fb0; color: #2a6fb0; font-weight: 700; }
.ecp input { border: 1px solid #bbb; border-radius: 4px; padding: 8px 10px; width: 100%; background: #fafafa; }
.ecp .pay { background: #444; color: #fff; border: 0; border-radius: 4px; padding: 12px; font-weight: 700; cursor: pointer; font-size: 16px; }

footer.fine { margin-top: 36px; }
footer.fine .notice { font-size: 14px; }
footer.fine .links { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--ink-3); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: #fff; padding: 12px 20px; border-radius: 999px; font-weight: 700; box-shadow: var(--shadow-soft); z-index: 20; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .card, .tile, .btn { transition: box-shadow .15s, border-color .15s, background .15s; } }
.mapgrid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 900px) { .mapgrid { grid-template-columns: minmax(340px, 440px) minmax(0, 1fr); } .mapgrid > :first-child { position: sticky; top: 12px; } }
.map .bub text { font-size: 7px; }
.map .lbl { font-size: 6.4px; stroke-width: 2px; }

.edu { height: 100%; }
.edu > .row:last-child { margin-top: auto; }

</style>

/* ---------- map ---------- */
const FILLS = ["#fffaf6", "#ebe3f8", "#dccff3", "#b7a0e3", "#9a80d1"];
const fillFor = (n) => FILLS[n <= 0 ? 0 : n <= 2 ? 1 : n <= 4 ? 2 : n <= 7 ? 3 : 4];
/** Schools of one city sit on a small ring around the city's middle, so pins never cover each other. */
function mapPins(s) {
  const c = MAP.c[s.city]; const mates = SCHOOLS.filter((x) => x.city === s.city); const n = mates.length; const i = mates.indexOf(s);
  if (n === 1) return { x: c.x, y: c.y };
  const ang = (2 * Math.PI * i) / n + 0.6, r = Math.min(12, 5 + n * 1.6);
  return { x: Math.round((c.x + Math.cos(ang) * r) * 10) / 10, y: Math.round((c.y + Math.sin(ang) * r) * 10) / 10 };
}

/** Taiwan with a count bubble per city; click a city to filter the list beside it. */
function educatorMap(counts, selected, note) {
  const paths = Object.entries(MAP.c).map(([k, c]) => `<path class="city${selected === k ? " sel" : ""}" d="${c.d}" fill="${fillFor(counts[k] || 0)}" data-act="city" data-v="${k}" role="button" tabindex="0" aria-label="${h(lab(CITY[k]))}: ${counts[k] || 0}"><title>${h(lab(CITY[k]))}</title></path>`).join("");
  const NUDGE = { taipei: [-3, -4], "new-taipei": [7, 5], keelung: [6, -3], taoyuan: [-6, 0], "hsinchu-city": [-3, 2] };
  const bubbles = Object.keys(counts).filter((k) => counts[k] > 0 && MAP.c[k]).map((k) => { const n = NUDGE[k] || [0, 0]; const c = { x: MAP.c[k].x + n[0], y: MAP.c[k].y + n[1] }; const r = 5.5 + Math.min(4, Math.log2(counts[k] + 1)); return `<g class="bub" data-act="city" data-v="${k}"><circle cx="${c.x}" cy="${c.y}" r="${r}"/><text x="${c.x}" y="${c.y}">${counts[k]}</text></g>`; }).join("");
  const labels = Object.keys(counts).filter((k) => counts[k] > 0 && MAP.c[k] && ["taichung", "tainan", "kaohsiung", "hsinchu-city"].includes(k)).map((k) => { const c = MAP.c[k]; return `<text class="lbl" x="${c.x}" y="${c.y + 15}">${h(lab(CITY[k]).replace(" City", ""))}</text>`; }).join("");
  return `<div class="map"><svg viewBox="0 0 ${MAP.W} ${MAP.H}" role="group" aria-label="${T("Map of Taiwan", "臺灣地圖")}">${paths}${labels}${bubbles}</svg>
    <div class="legend"><b>${T("Educators per area", "各地區教師人數")}</b><div class="scale">${FILLS.map((f) => `<i style="background:${f}"></i>`).join("")}</div><div class="row small" style="gap:14px;justify-content:space-between"><span>${T("Fewer", "較少")}</span><span>${T("More", "較多")}</span></div></div></div>
    <p class="mapnote">${note}</p>`;
}

/** Taiwan with a pin per school; schools with open job posts carry an apricot dot. */
function jobMap(schools, jobCount, selectedSchool, selectedCity) {

}

    body: `<label class="lab" for="f-name">${T("Your name", "您的名字")}</label><input class="field" id="f-name" data-f="name" value="${h(val("name"))}" autocomplete="off" placeholder="${T("e.g. Mei", "例如：小美")}"><p class="hint" style="margin-top:8px">${T("In this demo nothing is sent anywhere. In the real site you also give an email and password, and verify your email.", "此示範不會傳送任何資料。真實網站還需要電子郵件與密碼，並驗證電子郵件。")}</p>`,
    back: "signupBack", next: "signup2", nextLabel: T("Continue", "繼續"), nextDisabled: val("name").trim().length < 1 });
  return frame({ step, total: 3, say: T("One important thing before we start. It takes ten seconds.", "開始前有一件重要的事，只需十秒。"), q: T("Please read this", "請先閱讀"),
    body: `${noticeBox()}<div style="margin-top:14px">${ackBox("ack")}</div>`, back: "signupBack", next: "signup3", nextLabel: T("Create my account", "建立我的帳號"), nextDisabled: !val("ack") });
};

/* ================= dashboards ================= */

    return `<div class="stack"><h1>${T("Hello", "您好")}, ${h(m.name)}</h1><p class="muted">${T("Family account", "家庭帳號")}</p>

      : `<div class="card soft"><h2>${T("Join for 12 months", "加入 12 個月")}</h2><div class="price" style="margin:6px 0">${nt(PRICE_FAMILY)} <span class="small muted">${T("VAT included", "含稅")}</span></div><p class="muted">${T("See educators who offer private tutoring, on a map and a list, and ask for their contact details.", "在地圖與清單上查看提供私人家教的教師，並申請查看他們的聯絡方式。")}</p><div class="row" style="margin-top:16px"><button class="btn btn-primary btn-lg" data-act="join" data-v="family">${T("Join as a family", "以家庭加入")}</button></div></div>`}
      </div>`;
  }
  if (m.type === "school") {

    return `<div class="stack"><h1>${T("Hello", "您好")}, ${h(m.name)}</h1><p class="muted">${T("School account", "學校帳號")}</p>
      ${mine.length === 0 ? `<div class="card soft"><h2>${T("Start by finding your school", "先找到您的學校")}</h2><p class="muted" style="margin-top:6px">${T("Claim each campus you want to pay for. In the real site an administrator checks every claim.", "認領您要付費的每個校區。在真實網站中，每個認領都會由管理員審核。")}</p><div class="row" style="margin-top:16px"><button class="btn btn-primary btn-lg" data-act="nav" data-v="campuses">${T("Find my school", "尋找我的學校")}</button></div></div>`
      : `<div class="card soft"><h2>${T("Your campuses", "您的校區")}</h2><ul class="stack" style="list-style:none;padding:0;margin-top:12px">${mine.map((s) => { const mem = st.memberships.find((x) => x.holder === m.id && x.schoolId === s.id && x.end > TODAY); return `<li class="row" style="justify-content:space-between;border-bottom:1.5px solid var(--line-2);padding-bottom:10px"><span><b>${h(s.name)}</b><br><span class="small muted">${h(lab(KIND[s.kind]))} · ${h(placeName(s))}</span></span>${mem ? `<span class="badge">${T("Active until", "有效至")} ${fmtDate(mem.end)}</span>` : `<span class="badge apricot">${T("Not paid yet", "尚未付款")}</span>`}</li>`; }).join("")}</ul>
        <p class="small muted" style="margin-top:10px">${nt(PRICE_CAMPUS)} ${T("per campus. Each campus has its own 12 months.", "每校區。每個校區各有 12 個月。")}</p>
        <div class="row" style="margin-top:14px">${unpaid.length ? `<button class="btn btn-primary btn-lg" data-act="join" data-v="school">${T("Pay for campuses", "支付校區費用")}</button>` : ""}<button class="btn" data-act="nav" data-v="campuses">${T("Add another campus", "新增校區")}</button>${paidCampusIds(m.id).length ? `<button class="btn" data-act="nav" data-v="educators">${T("Find educators", "尋找教師")}</button><button class="btn" data-act="nav" data-v="jobnew">${T("Post a job", "刊登職缺")}</button><button class="btn" data-act="nav" data-v="myjobs">${T("My job posts", "我的職缺")}</button>` : ""}</div></div>`}
      ${myOrders().filter((o) => o.status === "pending").map((o) => `<div class="card"><span class="badge apricot">${T("Waiting for payment", "等待付款")}</span> ${nt(o.amount)} <button class="link-btn" data-act="order" data-v="${o.id}">${T("Open my order", "開啟我的訂單")}</button></div>`).join("")}
      </div>`;
  }
  if (m.type === "educator") {
    const p = st.myProfile;
    const asks = st.reveals.filter((r) => r.eduId === "e-me");
    return `<div class="stack"><h1>${T("Hello", "您好")}, ${h(m.name)}</h1><p class="muted">${T("Educator account. Free, always.", "教師帳號。永遠免費。")}</p>
      <div class="card soft"><h2>${p && p.published ? T("Your profile is published", "您的檔案已發布") : p ? T("Your profile is a draft", "您的檔案是草稿") : T("Create your profile", "建立您的檔案")}</h2>
        <p class="muted" style="margin-top:6px">${p && p.published ? T("Paying members who match what you are open to can see it, by area only. You can hide it any time.", "符合您開放條件的付費會員可看到它，僅顯示地區。您隨時可以隱藏。") : T("It takes about two minutes, one question at a time, with a live preview.", "約需兩分鐘，一次一個問題，並即時預覽。")}</p>
        <div class="row" style="margin-top:16px"><button class="btn btn-primary btn-lg" data-act="nav" data-v="profile">${p ? T("Edit my profile", "編輯我的檔案") : T("Start", "開始")}</button>${p && p.published ? `<button class="btn" data-act="hideProfile">${T("Hide my profile", "隱藏我的檔案")}</button>` : ""}</div></div>
      <div class="card"><h3>${T("Job posts from schools", "學校的職缺")}</h3><p class="muted">${T("Full-time and part-time jobs, visible only to signed-in educators who have a profile.", "全職與兼職職缺，只有已登入且有檔案的教師看得到。")}</p><div class="row" style="margin-top:12px"><button class="btn" data-act="nav" data-v="jobs">${T("See the job map", "查看職缺地圖")}</button></div></div>
      <div class="card"><h3>${T("Who asked about you", "誰查看了您的聯絡方式")}</h3>${asks.length ? `<ul>${asks.map((r) => `<li>${r.byType === "school" ? `<b>${h(r.byName)}</b> ${T("(a school)", "（學校）")}` : T("A family (anonymous)", "一個家庭（匿名）")} · ${fmtDate(r.day)}</li>`).join("")}</ul>` : `<p class="muted">${T("Nobody yet. When a paying member opens your contact details you will see it here: schools by name, families anonymously.", "目前還沒有。當付費會員查看您的聯絡方式時會顯示在這裡：學校顯示名稱，家庭匿名。")}</p>`}</div>
      </div>`;
  }
  return `<div class="stack"><h1>${T("Admin desk", "管理員後台")}</h1><button class="btn btn-primary" data-act="nav" data-v="admin">${T("Open", "開啟")}</button></div>`;
};

/* ================= checkout (family and school share one flow) ================= */
V.join = () => {
  const type = st.args.type;
  const step = val("step", 1);
  const campuses = type === "school" ? ownedCampuses(pid()).filter((s) => !campusActive(pid(), s.id)) : [];
  if (type === "school" && st.form.picked === undefined) st.form.picked = campuses.map((s) => s.id);
  const picked = type === "school" ? st.form.picked.filter((id) => campuses.some((s) => s.id === id)) : [];
  const total = type === "family" ? PRICE_FAMILY : PRICE_CAMPUS * picked.length;
  const method = val("method", "ecpay");
  const receipt = type === "family"
    ? `<div class="eyebrow">${T("Your membership", "您的會員資格")}</div><ul class="ticks"><li>${nt(PRICE_FAMILY)} ${T("for 12 months, VAT included", "12 個月，含稅")}</li><li>${T("Your 12 months start when your payment is confirmed: straight away for an online payment, after an administrator checks a bank transfer.", "付款確認後 12 個月開始：線上付款立即生效，銀行轉帳則在管理員核對後生效。")}</li><li>${T("It never renews by itself. We send a reminder before it ends.", "不會自動續約，到期前會提醒您。")}</li></ul><div class="total"><span>${T("Total, VAT included", "合計（含稅）")}</span><b>${nt(PRICE_FAMILY)}</b></div>`
    : `<div class="eyebrow">${T("Your order", "您的訂單")}</div><ul class="ticks">${picked.map((id) => `<li>${h(SCHOOLS.find((s) => s.id === id).name)}: ${nt(PRICE_CAMPUS)}</li>`).join("") || `<li class="muted">${T("No campus chosen yet", "尚未選擇校區")}</li>`}<li>${T("No discount for extra campuses. Each campus gets its own 12 months from the day it starts.", "額外校區沒有折扣。每個校區從開始日起各有 12 個月。")}</li></ul><div class="total"><span>${T("Total, VAT included", "合計（含稅）")}</span><b>${nt(total)}</b></div>`;
  const exit = { act: "nav", v: "dashboard", label: "← " + T("Not now, back to my dashboard", "先不要，回到我的儀表板") };
  if (step === 1) {
    if (type === "family") return frame({ step, total: 3, aside: receipt, exit, say: T("Hi, I am Link. Here is exactly how this works, with no small print.", "嗨，我是 Link。以下是運作方式，沒有任何小字。"), q: T("Here is how it works", "運作方式如下"),
      body: `<ul class="ticks" style="font-size:17px"><li>${T("You pay once: NT$2,000 for 12 months, VAT included.", "一次付款：12 個月 NT$2,000，含稅。")}</li><li>${T("You see educators who offer private tutoring, with their rates, on a map and a list.", "您可以在地圖與清單上看到提供私人家教的教師與費用。")}</li><li>${T("You can ask to see an educator's contact details, up to 100 educators a day.", "您可以申請查看教師的聯絡方式，每天最多 100 位。")}</li><li>${T("It never renews by itself.", "不會自動續約。")}</li></ul>`, next: "joinNext", nextLabel: T("Continue", "繼續") });
    return frame({ step, total: 3, aside: receipt, exit, say: T("Every campus has its own 12 months, so you can add campuses whenever you like.", "每個校區各有 12 個月，您隨時可以新增校區。"), q: T("Which campuses are you paying for?", "您要為哪些校區付費？"),
      body: campuses.length ? `<div class="grid g2">${campuses.map((s) => `<button class="tile" data-act="togglePick" data-v="${s.id}" ${selm("picked", s.id)}><span class="t">${h(s.name)}</span><span class="d">${h(lab(KIND[s.kind]))} · ${h(placeName(s))} · ${nt(PRICE_CAMPUS)}</span></button>`).join("")}</div>` : `<div class="notice">${T("You have no campuses to pay for. Claim a campus first.", "您沒有需要付費的校區，請先認領校區。")} <button class="link-btn" data-act="nav" data-v="campuses">${T("Find my school", "尋找我的學校")}</button></div>`,
      next: "joinNext", nextLabel: T("Continue", "繼續"), nextDisabled: picked.length === 0 });
  }
  if (step === 2) {
    const inv = val("inv", "personal");
    return frame({ step, total: 3, aside: receipt, exit, say: T("Some people like an invoice with a company 統一編號. Totally optional.", "有些人需要附統一編號的發票，完全可選。"), q: T("Do you need an invoice?", "您需要發票嗎？"),
      body: `<div class="grid g2"><button class="tile" data-act="pick" data-k="inv" data-v="personal" ${sel("inv", "personal")}><span class="t">${T("A personal invoice is fine", "個人發票即可")}</span></button><button class="tile" data-act="pick" data-k="inv" data-v="company" ${sel("inv", "company")}><span class="t">${T("I need a company invoice", "我需要公司發票")}</span></button></div>${inv === "company" ? `<div class="grid g2" style="margin-top:14px"><div><label class="lab" for="f-tax">統一編號 (8 ${T("digits", "位數")})</label><input class="field" id="f-tax" data-f="tax" inputmode="numeric" maxlength="8" value="${h(val("tax"))}"></div><div><label class="lab" for="f-title">${T("Company name", "公司名稱")}</label><input class="field" id="f-title" data-f="title" value="${h(val("title"))}"></div></div>${val("tax") && !/^\d{8}$/.test(val("tax")) ? `<p class="err" style="margin-top:8px">${T("A 統一編號 has 8 digits.", "統一編號為 8 位數字。")}</p>` : ""}` : ""}<p class="hint" style="margin-top:12px">${T("We never ask for an ID number.", "我們不會要求您提供身分證字號。")}</p>`,
      back: "joinBack", next: "joinNext", nextLabel: T("Continue", "繼續"), nextDisabled: inv === "company" && !/^\d{8}$/.test(val("tax")) });
  }
  const summary = type === "family"
    ? (method === "ecpay" ? T("You are ordering one family membership for NT$2,000, VAT included. You will pay on ECPay's secure page and nothing is charged until you do.", "您正在訂購一份家庭會員，NT$2,000（含稅）。付款會在綠界的安全頁面進行，您付款前不會有任何扣款。") : T("You are ordering one family membership for NT$2,000, VAT included. You will get a reference code to put in your bank transfer.", "您正在訂購一份家庭會員，NT$2,000（含稅）。您會取得一組參考碼，請填寫在銀行轉帳備註。"))
    : (method === "ecpay" ? T(`You are ordering ${picked.length} campus(es) for ${nt(total)}, VAT included. You will pay on ECPay's secure page and nothing is charged until you do.`, `您正在訂購 ${picked.length} 間校區，合計 ${nt(total)}（含稅）。付款會在綠界的安全頁面進行，您付款前不會有任何扣款。`) : T(`You are ordering ${picked.length} campus(es) for ${nt(total)}, VAT included. You will get a reference code to put in your bank transfer.`, `您正在訂購 ${picked.length} 間校區，合計 ${nt(total)}（含稅）。您會取得一組參考碼，請填寫在銀行轉帳備註。`));
  return frame({ step, total: 3, aside: receipt, exit, say: method === "ecpay" ? T("Nearly done. I will make your order, then you choose card, ATM or store code and pay on ECPay's secure page.", "快完成了！我會先建立您的訂單，接著您選擇信用卡、ATM 或超商代碼，並在綠界的安全頁面付款。") : T("Nearly done. I will make your order and show you where to send the transfer.", "快完成了！我會建立您的訂單，並告訴您要轉帳到哪裡。"), q: T("Ready to place your order?", "準備好送出訂單了嗎？"),
    body: `<label class="lab">${T("How would you like to pay?", "要用哪種方式付款？")}</label><div class="grid g2"><button class="tile" data-act="pick" data-k="method" data-v="ecpay" ${sel("method", "ecpay")}><span class="t">${T("Online with ECPay", "線上付款（綠界 ECPay）")}</span><span class="d">${T("Card, ATM virtual account or convenience-store code. Your 12 months start as soon as the payment arrives.", "信用卡、ATM 虛擬帳號或超商代碼，款項到帳後會員資格立即開始。")}</span></button><button class="tile" data-act="pick" data-k="method" data-v="bank" ${sel("method", "bank")}><span class="t">${T("Bank transfer", "銀行轉帳")}</span><span class="d">${T("We show you the account and a reference code. We confirm the transfer by hand, which takes a few working days.", "我們會提供帳號與參考碼，並由人工確認轉帳，約需數個工作天。")}</span></button></div><p style="margin:16px 0">${summary}</p>${ackBox("ack")}<p class="hint" style="margin-top:10px">${T("We never ask for your ID number or your child's details.", "我們不會要求您提供身分證字號或孩子的資料。")}</p>`,
    back: "joinBack", next: "placeOrder", nextLabel: T("Place my order", "送出訂單"), nextDisabled: !val("ack") });
};

/* ================= order page ================= */
V.order = () => {
  const o = st.orders.find((x) => x.id === st.args.id);
  if (!o || o.by !== pid()) return `<div class="card">${T("Order not found.", "找不到訂單。")} <button class="link-btn" data-act="nav" data-v="dashboard">${T("Back", "返回")}</button></div>`;
  const label = o.type === "family" ? T("Family membership, 12 months", "家庭會員 12 個月") : T(`School membership, 12 months × ${o.campusIds.length} campus(es)`, `學校會員 12 個月 × ${o.campusIds.length} 間校區`);
  const head = `<div class="stack"><button class="link-btn" data-act="nav" data-v="dashboard">← ${T("Back to my dashboard", "回到我的儀表板")}</button><h1>${T("Your order", "您的訂單")}</h1>
    <div class="row"><span class="badge ${o.status === "paid" ? "" : "apricot"}">${o.status === "paid" ? T("Paid", "已付款") : o.status === "cancelled" ? T("Cancelled", "已取消") : T("Waiting for your payment", "等待您付款")}</span><span class="muted">${label}</span></div>`;
  const tail = `<div class="card flat"><h3>${T("Invoice details", "發票資料")}</h3><p>${o.invoice && o.invoice.tax ? `${h(o.invoice.title || "")} · 統一編號 ${h(o.invoice.tax)}` : T("Personal invoice", "個人發票")}</p></div>${o.campusIds.length ? `<div class="card flat"><h3>${T("Campuses", "校區")}</h3><ul>${o.campusIds.map((id) => `<li>${h(SCHOOLS.find((s) => s.id === id).name)}</li>`).join("")}</ul></div>` : ""}`;
  if (o.status === "paid") {
    const ms = st.memberships.filter((m) => m.orderId === o.id);
    return `${head}<div class="card soft"><h2>${T("Thank you. Your membership has started.", "謝謝您，您的會員資格已開始。")}</h2><p class="muted" style="margin-top:6px">${T("Paid", "付款日")} ${fmtDate(o.paidOn)} · ${nt(o.amount)} ${T("VAT included", "含稅")} · ${T("It never renews by itself.", "不會自動續約。")}</p><ul style="margin:10px 0 0">${ms.map((m) => `<li>${m.schoolId ? h(SCHOOLS.find((s) => s.id === m.schoolId).name) + ": " : ""}${fmtDate(m.start)} → ${fmtDate(m.end)}</li>`).join("")}</ul><div class="row" style="margin-top:16px"><button class="btn btn-primary btn-lg" data-act="nav" data-v="educators">${T("Find educators", "尋找教師")}</button></div></div>${tail}</div>`;
  }
  if (o.status === "cancelled") return `${head}<div class="card">${T("This order was cancelled.", "此訂單已取消。")}</div>${tail}</div>`;
  const cancel = `<div class="row"><p class="hint grow">${T("Changed your mind? Cancelling is free. Only cancel if you have not paid yet.", "改變主意了嗎？取消是免費的。若您尚未付款才能取消。")}</p><button class="btn" data-act="cancelOrder" data-v="${o.id}">${T("Cancel this order", "取消此訂單")}</button></div>`;
  if (o.method === "ecpay") {
    const m = (k, en, zh, hEn, hZh, i) => `<button class="${i === 0 ? "btn btn-primary" : "btn"} btn-lg" style="flex-direction:column;align-items:flex-start;border-radius:24px;text-align:left" data-act="toEcpay" data-v="${o.id}" data-m="${k}"><span>${T(en, zh)}</span><span class="small" style="font-weight:600;opacity:.8">${T(hEn, hZh)}</span></button>`;
    return `${head}<div class="card soft"><div class="eyebrow">${T("Pay online", "線上付款")}</div><div class="price">${nt(o.amount)} <span class="small muted">${T("VAT included", "含稅")}</span></div>
      <p style="margin-top:10px;max-width:640px">${T("You will go to ECPay's secure page and pay by card, ATM virtual account or at a convenience store. We never see or keep your card number.", "按下後會前往綠界 ECPay 的安全付款頁，可用信用卡、ATM 虛擬帳號或超商代碼付款。我們不會看到也不會保存您的卡號。")}</p>
      <p class="bold" style="margin:14px 0 8px">${T("Choose how to pay:", "請選擇付款方式：")}</p><div class="grid g3">${m("Credit", "Pay by card", "信用卡付款", "Visa, MasterCard or JCB", "Visa、MasterCard 或 JCB", 0)}${m("ATM", "ATM virtual account", "ATM 虛擬帳號", "Pay later by transfer or at an ATM", "取得帳號後，稍後轉帳或至 ATM 繳費", 1)}${m("CVS", "Convenience-store code", "超商代碼繳費", "Pay later at 7-ELEVEN, FamilyMart, Hi-Life or OK mart", "取得代碼後，稍後至超商繳費", 2)}</div>
      <p class="hint" style="margin-top:12px">${T("You can come back to this page and pay later. The order stays here until you pay or cancel it.", "您可以稍後回到這個頁面再付款。訂單會保留到您付款或取消為止。")} ${T("Your order reference (quote it if you write to us):", "您的訂單編號（來信時請提供）：")} <b class="num">${o.ref}</b></p></div>
      ${o.info ? `<div class="card flat"><h3>${o.info.kind === "ATM" ? T("Your ATM transfer details", "您的 ATM 轉帳資料") : T("Your convenience-store payment code", "您的超商繳費代碼")}</h3><p style="margin-top:6px">${o.info.kind === "ATM" ? T(`Bank code ${o.info.bank}, virtual account ${o.info.account}. Please pay before ${fmtDate(o.info.expire)}. Your membership starts once ECPay tells us the money arrived.`, `銀行代碼 ${o.info.bank}，虛擬帳號 ${o.info.account}，請於 ${fmtDate(o.info.expire)} 前完成繳費。綠界通知我們款項到帳後，會員資格即開始。`) : T(`Payment code ${o.info.code}. Please pay at the store before ${fmtDate(o.info.expire)}. Your membership starts once ECPay tells us the money arrived.`, `繳費代碼 ${o.info.code}，請於 ${fmtDate(o.info.expire)} 前至超商繳費。綠界通知我們款項到帳後，會員資格即開始。`)}</p>
        <div class="notice demo-only" style="margin-top:12px"><b>${T("Demo only:", "僅限示範：")}</b> ${T("pretend you have paid. In the real site ECPay sends our server a signed message when the money arrives, and nobody presses anything.", "假裝您已付款。在真實網站中，款項到帳時綠界會向我們的伺服器傳送簽章通知，無需任何人按鈕。")}<div style="margin-top:8px"><button class="btn" data-act="simulateNotice" data-v="${o.id}">${T("Pretend ECPay confirmed my payment", "假裝綠界已確認我的付款")}</button></div></div></div>` : ""}${tail}${cancel}</div>`;
  }
  return `${head}<div class="card soft"><div class="eyebrow">${T("Pay by bank transfer", "銀行轉帳付款")}</div><div class="price">${nt(o.amount)} <span class="small muted">${T("VAT included", "含稅")}</span></div>
    <p class="muted" style="margin-top:8px">${T("Send exactly this amount and write the reference code in the transfer note, so we can find your payment.", "請轉入正確金額，並將參考碼填寫在匯款備註，方便我們對帳。")}</p>
    <p class="num" style="font-size:clamp(30px,6vw,46px);font-weight:800;letter-spacing:.06em;margin:10px 0" data-ref>${o.ref}</p>
    <div class="notice">${T("The bank account details are not set yet. In the real site they appear here, from the server's private settings.", "尚未設定銀行帳號。在真實網站中，帳號會從伺服器的私人設定顯示在這裡。")}</div>
    <p class="small muted" style="margin-top:10px">${T("An administrator checks that the correct amount arrived and then confirms your order by hand, which starts your membership.", "管理員會核對款項金額無誤後，以人工確認您的訂單，會員資格才會開始。")}</p>
    <div class="notice demo-only" style="margin-top:12px"><b>${T("Demo only:", "僅限示範：")}</b> ${T("switch to the Admin role at the top to confirm this transfer.", "請從上方切換到管理員角色來確認此轉帳。")} <button class="link-btn" data-act="adminAsk" data-v="${o.id}">${T("Take me there", "帶我過去")}</button></div></div>${tail}${cancel}</div>`;
};

/* ================= the simulated ECPay page (the real one is ECPay's own, on ECPay's server) ================= */
V.ecpay = () => {

  const m = st.args.m;

  return `<div class="stack"><div class="notice demo-only"><b>${T("Demo only.", "僅限示範。")}</b> ${T("This page imitates ECPay's payment page. In the real site your browser goes to ECPay's own secure page on ECPay's server. We never see card numbers, and no money moves here.", "此頁面模擬綠界的付款頁。在真實網站中，您的瀏覽器會前往綠界伺服器上的安全付款頁。我們不會看到卡號，這裡也不會有任何款項移動。")}</div>
  <div class="ecp"><div class="hd"><b>ECPay 綠界</b><span>${T("Secure payment (demo)", "安全付款（示範）")}</span></div><div class="bd">
    <dl><dt>${T("Order number", "訂單編號")}</dt><dd>${o.ref.replace(/-/g, "")}01</dd><dt>${T("Merchant", "特店名稱")}</dt><dd>LearningLinks</dd><dt>${T("Item", "商品")}</dt><dd>${o.type === "family" ? "LearningLinks family membership 12 months" : `LearningLinks school membership 12 months x ${o.campusIds.length} campus`}</dd><dt>${T("Amount", "應付金額")}</dt><dd class="amt">NT$${o.amount.toLocaleString("en-US")}</dd></dl>
    <div class="methods">${["Credit", "ATM", "CVS"].map((k) => `<span class="${k === m ? "on" : ""}">${names[k]}</span>`).join("")}</div>
    ${m === "Credit" ? `<div><label for="cc" style="font-size:14px;color:#555">${T("Card number (pretend: type anything)", "信用卡號（示範：任意輸入）")}</label><input id="cc" inputmode="numeric" placeholder="0000-0000-0000-0000"></div><button class="pay" data-act="ecpayPay" data-v="${o.id}">${T("Pay now", "立即付款")}</button>`
    : `<p style="font-size:14px;color:#555">${m === "ATM" ? T("ECPay will give you a virtual account number. Pay it later by transfer or at an ATM.", "綠界會提供一組虛擬帳號，您可稍後轉帳或至 ATM 繳費。") : T("ECPay will give you a payment code. Pay it later at a convenience store.", "綠界會提供一組繳費代碼，您可稍後至超商繳費。")}</p><button class="pay" data-act="ecpayNumber" data-v="${o.id}" data-m="${m}">${m === "ATM" ? T("Get my account number", "取得我的帳號") : T("Get my payment code", "取得我的繳費代碼")}</button>`}
    <button class="link-btn" style="color:#2a6fb0" data-act="order" data-v="${o.id}">${T("Back to the shop", "返回商店")}</button></div></div></div>`;
};

/* ================= educators: members only, audience-filtered, map and list together ================= */
const eduCard = (e, type) => {
  const tut = type === "family";
  return `<article class="card flat edu"><div class="row"><div class="avatar" style="background:${e.mine ? "var(--apricot-300)" : "var(--lilac-100)"}">${h((e.name || "?")[0])}</div><div class="grow"><div class="nm">${h(e.name)} ${e.mine ? `<span class="badge apricot">${T("You", "您")}</span>` : ""}</div><div class="where">${h(placeName(e))}</div></div></div>
    <div>${h(e.head || "")}</div><div class="tags">${(e.subjects || []).map((s) => `<span class="badge">${h(lab(SUBJECT[s]))}</span>`).join("")}</div>
    <div class="small muted">${tut ? (e.rateMin ? `${nt(e.rateMin)}–${nt(e.rateMax)} ${T("per hour", "每小時")} · ` : "") + (e.levels || []).map((l) => lab(LEVEL[l])).join(", ") : (e.openTo || []).filter((o) => o !== "private_tutoring").map((o) => lab(OPEN[o])).join(" · ")}</div>
    <div class="row" style="margin-top:4px"><button class="btn" data-act="viewEdu" data-v="${e.id}">${T("View profile", "查看檔案")}</button></div></article>`;
};

const wall = (type) => {
  const m = me();
  const dummy = EDU.slice(0, 3).map((e) => eduCard(e, "family")).join("");
  const cta = !m ? `<p>${T("Educators are shown to paying members only. Nobody sees an educator without a membership.", "教師僅顯示給付費會員。沒有會員資格的人看不到任何教師。")}</p><div class="row" style="justify-content:center;margin-top:14px"><button class="btn btn-primary btn-lg" data-act="start" data-v="family">${T("Join as a family", "以家庭加入")}</button><button class="btn btn-lg" data-act="start" data-v="school">${T("Join as a school", "以學校加入")}</button></div>`
    : m.type === "family" ? `<p>${T("Join for 12 months to see educators who offer private tutoring.", "加入 12 個月，即可查看提供私人家教的教師。")}</p><div class="row" style="justify-content:center;margin-top:14px"><button class="btn btn-primary btn-lg" data-act="join" data-v="family">${T("Join as a family", "以家庭加入")} · ${nt(PRICE_FAMILY)}</button></div>`
    : m.type === "school" ? `<p>${T("Pay for a campus to see educators who are open to full-time or part-time work.", "為校區付費後，即可查看開放全職或兼職的教師。")}</p><div class="row" style="justify-content:center;margin-top:14px"><button class="btn btn-primary btn-lg" data-act="${ownedCampuses(m.id).length ? "join" : "nav"}" data-v="${ownedCampuses(m.id).length ? "school" : "campuses"}">${ownedCampuses(m.id).length ? T("Pay for campuses", "支付校區費用") : T("Find my school", "尋找我的學校")}</button></div>`
    : `<p>${T("Families and schools see educators. As an educator you see job posts from schools instead.", "家庭與學校可查看教師；教師則查看學校的職缺。")}</p>`;
  return `<div class="stack"><h1>${T("Find educators", "尋找教師")}</h1><div class="wall"><div class="blur grid g3" aria-hidden="true">${dummy}</div><div class="wallcta"><div class="card soft">${cta}</div></div></div></div>`;
};

V.educators = () => {
  const m = me();
  const type = m && (m.type === "family" || m.type === "school") ? m.type : null;
  if (!type || !hasMembership()) return wall(type);
  const base = visibleTo(type);
  const f = { subject: val("subject"), city: val("city"), work: val("work") };
  const pass = (e) => (!f.subject || e.subjects.includes(f.subject)) && (type !== "school" || !f.work || e.openTo.includes(f.work));
  const counts = {}; base.filter(pass).forEach((e) => { counts[e.city] = (counts[e.city] || 0) + 1; });
  const list = base.filter((e) => pass(e) && (!f.city || e.city === f.city));
  const opt = (obj, cur) => Object.keys(obj).map((k) => `<option value="${k}" ${cur === k ? "selected" : ""}>${h(lab(obj[k]))}</option>`).join("");
  return `<div class="stack"><div><h1>${T("Find educators", "尋找教師")}</h1><p class="muted">${type === "family" ? T("Showing educators who offer private tutoring or coaching.", "顯示提供私人家教或輔導的教師。") : T("Showing educators who are open to full-time or part-time work.", "顯示開放全職或兼職工作的教師。")}</p></div>
    ${type === "family" ? `<div class="notice">${h(noticeFull().tutoringWork)}</div>` : ""}
    <div class="card flat filters"><div class="grid g3"><div><label class="lab" for="f-subject">${T("Subject", "科目")}</label><select class="field" id="f-subject" data-f="subject" data-r="1"><option value="">${T("Any", "不限")}</option>${opt(SUBJECT, f.subject)}</select></div>
      <div><label class="lab" for="f-city">${T("City", "縣市")}</label><select class="field" id="f-city" data-f="city" data-r="1"><option value="">${T("Any", "不限")}</option>${DEMO_CITIES.map((c) => `<option value="${c}" ${f.city === c ? "selected" : ""}>${h(lab(CITY[c]))}</option>`).join("")}</select></div>
      ${type === "school" ? `<div><label class="lab" for="f-work">${T("Open to", "開放型態")}</label><select class="field" id="f-work" data-f="work" data-r="1"><option value="">${T("Full-time or part-time", "全職或兼職")}</option><option value="full_time" ${f.work === "full_time" ? "selected" : ""}>${T("Full-time", "全職")}</option><option value="part_time" ${f.work === "part_time" ? "selected" : ""}>${T("Part-time", "兼職")}</option></select></div>` : ""}</div></div>
    <div class="mapgrid"><div>${educatorMap(counts, f.city, T("Educators appear by area, never by address. Tap an area to see them.", "教師只顯示所在地區，不顯示地址。點選地區即可查看。") + " · " + base.filter(pass).length + " " + T("educators on the map", "位教師"))}${f.city ? `<button class="link-btn" data-act="city" data-v="${f.city}">${T("Show all areas", "顯示所有地區")}</button>` : ""}</div>
    <div class="stack"><h2>${f.city ? T("Educators in", "教師位於") + " " + h(lab(CITY[f.city])) : T("Educators in all areas", "所有地區的教師")} <span class="muted small">(${list.length})</span></h2>${list.length ? `<div class="grid g2">${list.slice(0, 12).map((e) => eduCard(e, type)).join("")}</div>${list.length > 12 ? `<p class="muted small">${T("Showing the first 12. Narrow the filters to see others.", "僅顯示前 12 位。請縮小篩選條件查看其他教師。")}</p>` : ""}` : `<div class="card flat">${T("Nobody matches. Try removing a filter.", "沒有符合的教師，請試著移除篩選條件。")}</div>`}</div></div></div>`;
};

V.educator = () => {
  const m = me();
  const type = m && (m.type === "family" || m.type === "school") ? m.type : null;
  const e = type && hasMembership() ? visibleTo(type).find((x) => x.id === st.args.id) : null;
  if (!e) return `<div class="card">${T("This educator is not available to you. (Tutoring-only educators are never shown to schools, and school-work educators are never shown to families.)", "您無法查看這位教師。（只做家教的教師不會顯示給學校，只找學校工作的教師不會顯示給家庭。）")} <button class="link-btn" data-act="nav" data-v="educators">${T("Back", "返回")}</button></div>`;
  const rev = st.reveals.find((r) => r.eduId === e.id && r.by === m.id);
  const today = st.reveals.filter((r) => r.by === m.id && r.day === TODAY).length;
  const langs = { en: T("English", "英語"), zh: T("Mandarin", "華語") };
  return `<div class="stack"><button class="link-btn" data-act="nav" data-v="educators">← ${T("Back to the map and list", "回到地圖與清單")}</button>
    <div class="card soft"><div class="row"><div class="avatar" style="width:64px;height:64px;font-size:26px;background:var(--lilac-100)">${h(e.name[0])}</div><div><h1 style="font-size:32px">${h(e.name)}</h1><div class="muted">${h(placeName(e))}</div></div></div>
      <p style="margin:14px 0;font-size:18px">${h(e.head)}</p><p>${h(e.bio)}</p>
      <div class="tags" style="margin-top:12px">${e.subjects.map((s) => `<span class="badge">${h(lab(SUBJECT[s]))}</span>`).join("")}${e.levels.map((s) => `<span class="badge plain">${h(lab(LEVEL[s]))}</span>`).join("")}</div>
      <dl class="small" style="display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:16px 0 0"><dt class="muted">${T("Languages", "教學語言")}</dt><dd style="margin:0">${e.langs.map((l) => langs[l]).join(", ")}</dd><dt class="muted">${T("Experience", "經驗")}</dt><dd style="margin:0">${e.exp} ${T("years", "年")}</dd>
      ${type === "family" ? `<dt class="muted">${T("Rate", "費用")}</dt><dd style="margin:0"><b>${nt(e.rateMin)}–${nt(e.rateMax)}</b> ${T("per hour", "每小時")}</dd>` : `<dt class="muted">${T("Open to", "開放型態")}</dt><dd style="margin:0">${e.openTo.filter((o) => o !== "private_tutoring").map((o) => lab(OPEN[o])).join(", ")}</dd><dt class="muted">${T("Looking for", "期望")}</dt><dd style="margin:0">${h(e.wish)}</dd>`}</dl>
      <p class="tiny muted" style="margin-top:10px">${type === "family" ? T("You see the tutoring side of this profile. School-work wishes are not shown to families.", "您看到的是此檔案的家教部分。找學校工作的意願不會顯示給家庭。") : T("You see the school-work side of this profile. Tutoring and rates are not shown to schools.", "您看到的是此檔案的學校工作部分。家教與費用不會顯示給學校。")}</p></div>
    ${type === "family" ? `<div class="notice">${h(noticeFull().tutoringWork)}</div>` : ""}
    <div class="card"><h3>${T("Contact details", "聯絡方式")}</h3>${rev ? `<dl class="small" style="display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:10px 0 0"><dt class="muted">Email</dt><dd style="margin:0" data-testid="contact-email">${h(e.email)}</dd><dt class="muted">LINE</dt><dd style="margin:0">${h(e.line)}</dd></dl><p class="hint" style="margin-top:8px">${T("These are the contact details the educator chose to share. We are not an employer or an agent, and we do not run background checks.", "這些是教師選擇分享的聯絡方式。我們不是雇主或仲介，也不進行背景調查。")}</p>` : `<p class="muted" style="margin-top:6px">${T(`Showing contact details is logged. You have opened ${today} of ${REVEAL_CAP} educators today.`, `查看聯絡方式會留下紀錄。您今天已查看 ${today} / ${REVEAL_CAP} 位教師。`)}</p><div class="row" style="margin-top:12px"><button class="btn btn-primary btn-lg" data-act="reveal" data-v="${e.id}">${T("Show contact details", "顯示聯絡方式")}</button></div>`}</div>
    <div class="row"><button class="link-btn" data-act="reportOpen" data-t="educator" data-v="${e.id}">${T("Report this profile", "檢舉此檔案")}</button></div></div>`;
};

/* ================= schools: claim a campus, post jobs ================= */
V.campuses = () => {
  const m = me();
  if (!m || m.type !== "school") return V.home();
  const q = val("q").trim().toLowerCase();
  const list = SCHOOLS.filter((s) => (!st.owners[s.id] || st.owners[s.id] === m.id) && (!q || s.name.toLowerCase().includes(q) || lab(CITY[s.city]).toLowerCase().includes(q)));
  return `<div class="stack"><div><h1>${T("Find your school", "尋找您的學校")}</h1><p class="muted">${T("Claim each campus you want to pay for. Each campus is NT$10,000 for its own 12 months. In the real site an administrator checks every claim.", "認領您要付費的每個校區。每個校區 NT$10,000，各有 12 個月。在真實網站中，每個認領都會由管理員審核。")}</p></div>
    <div><label class="lab" for="f-q">${T("Search by name or city", "以名稱或縣市搜尋")}</label><input class="field" id="f-q" data-f="q" data-r="1" value="${h(val("q"))}" placeholder="${T("e.g. Sunshine, Taipei", "例如：Sunshine、Taipei")}"></div>
    <div class="grid g2">${list.map((s) => { const mine = st.owners[s.id] === m.id; return `<div class="card flat"><b>${h(s.name)}</b><div class="small muted">${h(lab(KIND[s.kind]))} · ${h(placeName(s))}</div><div class="row" style="margin-top:10px">${mine ? `<span class="badge">${T("Your campus", "您的校區")}</span>` : `<button class="btn" data-act="claim" data-v="${s.id}">${T("This is my school", "這是我的學校")}</button>`}</div></div>`; }).join("") || `<div class="card flat">${T("No school matches.", "沒有符合的學校。")}</div>`}</div>
    ${ownedCampuses(m.id).length ? `<div class="row"><button class="btn btn-primary btn-lg" data-act="nav" data-v="dashboard">${T("Continue", "繼續")}</button></div>` : ""}</div>`;
};

const SUBST = /substitut|cover(?:ing)?\b|relief teacher|supply teacher|temp(?:orary)? (?:cover|teacher)|代課|臨時代班|代班/i;
V.jobnew = () => {
  const m = me();
  if (!m || m.type !== "school") return V.home();
  const paid = ownedCampuses(m.id).filter((s) => campusActive(m.id, s.id));
  if (!paid.length) return `<div class="card">${T("Only schools with an active membership can post jobs. Pay for a campus first.", "只有會員有效的學校才能刊登職缺，請先為校區付費。")} <button class="link-btn" data-act="nav" data-v="dashboard">${T("Back", "返回")}</button></div>`;
  const bad = SUBST.test(val("title") + " " + val("desc"));
  const ok = val("title").trim() && val("desc").trim() && /@/.test(val("contact")) && !bad;
  return `<div class="stack"><div><h1>${T("Post a job", "刊登職缺")}</h1><p class="muted">${T("Full-time or part-time only. Job posts are visible only to signed-in educators who have a profile.", "僅限全職或兼職。職缺只有已登入且有檔案的教師看得到。")}</p></div>
    <div class="card soft stack"><div><label class="lab" for="f-campus">${T("Campus", "校區")}</label><select class="field" id="f-campus" data-f="campus" data-r="1">${paid.map((s) => `<option value="${s.id}" ${val("campus", paid[0].id) === s.id ? "selected" : ""}>${h(s.name)}</option>`).join("")}</select></div>

/* ================= educators: the guided profile and the school/job map ================= */
const blankProfile = () => ({ open: [], city: "", district: "", subjects: [], levels: [], name: (me() || {}).name || "", head: "", bio: "", rateMin: "", rateMax: "", wish: "", email: "", line: "", waiver: false, ack: false });
function openProfile() {
  const p = st.myProfile;
  go("profile");
  st.form = p ? { open: p.openTo.slice(), city: p.city, district: p.district || "", subjects: p.subjects.slice(), levels: p.levels.slice(), name: p.name, head: p.head, bio: p.bio, rateMin: p.rateMin || "", rateMax: p.rateMax || "", wish: p.wish || "", email: p.email, line: p.line, waiver: true, ack: true } : blankProfile();
  render(true);
}
const looksPrivate = (s) => /@|\b\d{8,}\b|\b[A-Z][12]\d{8}\b|line\s*id|whatsapp|wechat/i.test(s || "");
V.profile = () => {

    body: `<div class="grid g3">${Object.keys(OPEN).map((k) => `<button class="tile" data-act="toggle" data-k="open" data-v="${k}" ${selm("open", k)}><span class="t">${h(lab(OPEN[k]))}</span><span class="d">${k === "private_tutoring" ? T("Seen by families, with your rate", "家庭可見，含您的費用") : T("Seen by schools", "學校可見")}</span></button>`).join("")}</div>${tut ? `<div class="notice" style="margin-top:14px">${h(noticeFull().tutoringWork)}</div>` : ""}`, next: "profNext", nextLabel: T("Continue", "繼續"), nextDisabled: !(f.open || []).length });
  if (step === 2) return frame({ ...common, step, back: "profBack", say: T("Only the area is shown, never an address.", "只會顯示地區，絕不顯示地址。"), q: T("Where are you?", "您在哪裡？"),
    body: `<div class="pills">${DEMO_CITIES.map((c) => `<button class="pill" data-act="pick" data-k="city" data-v="${c}" ${sel("city", c)}>${h(lab(CITY[c]))}</button>`).join("")}</div>${f.city && distsOf(f.city).length ? `<p class="lab" style="margin:16px 0 8px">${T("District", "行政區")}</p><div class="pills">${distsOf(f.city).map((d) => `<button class="pill" data-act="pick" data-k="district" data-v="${d}" ${sel("district", d)}>${h(lab(DIST[d]))}</button>`).join("")}</div>` : ""}`, next: "profNext", nextLabel: T("Continue", "繼續"), nextDisabled: !f.city });
  if (step === 3) return frame({ ...common, step, back: "profBack", say: T("Pick as many as fit.", "符合的都可以選。"), q: T("What do you teach?", "您教什麼？"),
    body: `<p class="lab">${T("Subjects", "科目")}</p><div class="pills">${Object.keys(SUBJECT).map((k) => `<button class="pill" data-act="toggle" data-k="subjects" data-v="${k}" ${selm("subjects", k)}>${h(lab(SUBJECT[k]))}</button>`).join("")}</div><p class="lab" style="margin-top:16px">${T("Levels", "年級")}</p><div class="pills">${Object.keys(LEVEL).map((k) => `<button class="pill" data-act="toggle" data-k="levels" data-v="${k}" ${selm("levels", k)}>${h(lab(LEVEL[k]))}</button>`).join("")}</div>`, next: "profNext", nextLabel: T("Continue", "繼續"), nextDisabled: !(f.subjects || []).length || !(f.levels || []).length });
  if (step === 4) { const bad = looksPrivate(f.bio) || looksPrivate(f.head); return frame({ ...common, step, back: "profBack", say: T("A friendly line or two is plenty.", "一兩句友善的介紹就夠了。"), q: T("Tell people about you", "介紹一下您自己"),
    body: `<div class="stack"><div><label class="lab" for="f-name">${T("Display name", "顯示名稱")}</label><input class="field" id="f-name" data-f="name" value="${h(f.name)}" maxlength="40"></div><div><label class="lab" for="f-head">${T("Headline", "標題")}</label><input class="field" id="f-head" data-f="head" value="${h(f.head)}" maxlength="90" placeholder="${T("e.g. Patient English teacher for young learners", "例如：有耐心的兒童英語教師")}"></div><div><label class="lab" for="f-bio">${T("About you", "關於您")}</label><textarea class="field" id="f-bio" data-f="bio" maxlength="600">${h(f.bio)}</textarea></div>${bad ? `<p class="err" role="alert">${T("Please do not put contact details, ID numbers or messaging IDs in your profile text. You choose who sees your contact details later.", "請不要在檔案文字中放入聯絡方式、證件號碼或通訊軟體帳號。您之後可以自行決定誰能看到聯絡方式。")}</p>` : ""}</div>`, next: "profNext", nextLabel: T("Continue", "繼續"), nextDisabled: !(f.name || "").trim() || !(f.head || "").trim() || !(f.bio || "").trim() || bad }); }
  if (step === 5) return frame({ ...common, step, back: "profBack", say: T("Rates go to families only. Schools never see them.", "費用只給家庭看，學校不會看到。"), q: tut ? T("Your rate and wishes", "您的費用與期望") : T("What are you looking for?", "您在找什麼？"),
    body: `<div class="stack">${tut ? `<div class="grid g2"><div><label class="lab" for="f-rateMin">${T("Rate from (NT$ per hour)", "費用起（每小時 NT$）")}</label><input class="field" id="f-rateMin" data-f="rateMin" inputmode="numeric" value="${h(f.rateMin)}"></div><div><label class="lab" for="f-rateMax">${T("to", "至")}</label><input class="field" id="f-rateMax" data-f="rateMax" inputmode="numeric" value="${h(f.rateMax)}"></div></div>` : ""}${school ? `<div><label class="lab" for="f-wish">${T("What kind of school work? (schools only)", "想找哪種學校工作？（僅學校可見）")}</label><input class="field" id="f-wish" data-f="wish" value="${h(f.wish)}" placeholder="${T("e.g. Kindergarten, afternoons", "例如：幼兒園，下午時段")}"></div>` : ""}</div>`, next: "profNext", nextLabel: T("Continue", "繼續"), nextDisabled: (tut && !(Number(f.rateMin) > 0 && Number(f.rateMax) >= Number(f.rateMin))) || (school && !(f.wish || "").trim()) });
  return frame({ ...common, step: 6, back: "profBack", say: T("Last one. Your contact details stay hidden until a paying member asks.", "最後一步。付費會員提出申請前，您的聯絡方式都會保持隱藏。"), q: T("Contact details and consent", "聯絡方式與同意"),
    body: `<div class="stack"><div class="grid g2"><div><label class="lab" for="f-email">Email</label><input class="field" id="f-email" data-f="email" value="${h(f.email)}" placeholder="you@example.com"></div><div><label class="lab" for="f-line">LINE ID</label><input class="field" id="f-line" data-f="line" value="${h(f.line)}"></div></div>
    <div class="notice">${T("Publication waiver (summary, draft): I agree that my profile is shown by area to paying members who match what I am open to, that contact details are shown only when a member asks, and that I can hide or delete my profile at any time.", "刊登同意書（摘要，草稿）：我同意我的檔案以地區方式顯示給符合我開放條件的付費會員，聯絡方式僅在會員申請時顯示，且我可隨時隱藏或刪除檔案。")}</div>
    <label class="ack"><input type="checkbox" id="f-waiver" data-f="waiver" data-r="1" ${f.waiver ? "checked" : ""}><span>${T("I agree to the publication waiver.", "我同意刊登同意書。")}</span></label>${ackBox("ack")}</div>`,
    next: "profPublish", nextLabel: T("Publish my profile", "發布我的檔案"), nextDisabled: !(f.email || "").includes("@") || !f.waiver || !f.ack });
};

V.jobs = () => {
  const m = me();
  if (!m || m.type !== "educator" || !st.myProfile) return `<div class="stack"><h1>${T("Job posts from schools", "學校的職缺")}</h1><div class="card soft"><p>${T("Job posts are visible only to signed-in educators who have a profile. Not to the public, families, other schools or search engines.", "職缺只有已登入且有檔案的教師看得到，公眾、家庭、其他學校與搜尋引擎都看不到。")}</p>${m && m.type === "educator" ? `<div class="row" style="margin-top:14px"><button class="btn btn-primary btn-lg" data-act="nav" data-v="profile">${T("Create my profile", "建立我的檔案")}</button></div>` : `<div class="row" style="margin-top:14px"><button class="btn btn-primary btn-lg" data-act="start" data-v="educator">${T("I am an educator (free)", "我是教師（免費）")}</button></div>`}</div></div>`;

    ${shown.length ? shown.map((j) => { const s = SCHOOLS.find((x) => x.id === j.schoolId); return `<article class="card flat stack"><div class="row" style="justify-content:space-between"><div><b style="font-size:18px">${h(j.title)}</b><div class="small muted">${h(s.name)} · ${h(lab(KIND[s.kind]))} · ${h(placeName(s))}</div></div><span class="badge apricot">${h(lab(OPEN[j.type]))}</span></div><p>${h(j.desc)}</p><div class="tags"><span class="badge">${h(lab(SUBJECT[j.subject]))}</span></div><p class="small"><b>${T("Apply:", "應徵：")}</b> ${h(j.contact)}</p><div><button class="link-btn" data-act="reportOpen" data-t="job" data-v="${j.id}">${T("Report this job post", "檢舉此職缺")}</button></div></article>`; }).join("") : ""}
    <p class="small muted">${T("Job posts are written by schools. LearningLinks does not check them or the schools. Check every detail yourself.", "職缺由學校自行撰寫。LearningLinks 不會查核職缺或學校，請自行確認每個細節。")}</p></div></div></div>`;

V.report = () => {

  const target = t === "educator" ? (eduById(id) || {}).name : (st.jobs.find((j) => j.id === id) || {}).title;
  const reasons = t === "job" ? [["misleading", T("Misleading information", "資訊誤導")], ["payment_or_documents", T("A request for payment or documents", "要求付款或文件")], ["substitute", T("Offers substitute or cover work", "提供代課或臨時代班")], ["discrimination", T("Discrimination", "歧視")], ["other", T("Something else", "其他")]] : [["misleading", T("Misleading information", "資訊誤導")], ["abusive", T("Abusive behaviour", "不當行為")], ["payment_or_documents", T("A request for payment or documents", "要求付款或文件")], ["discrimination", T("Discrimination", "歧視")], ["other", T("Something else", "其他")]];

V.admin = () => {

      <div class="row"><div><label class="lab small" for="f-amt-${o.id}">Amount received (NT$)</label><input class="field" style="max-width:180px" id="f-amt-${o.id}" data-f="amt-${o.id}" inputmode="numeric" value="${h(val("amt-" + o.id, String(o.amount)))}"></div><button class="btn btn-primary" data-act="adminConfirm" data-v="${o.id}">Confirm payment</button></div></div>`).join("") : `<div class="card flat">Nothing is waiting.</div>`}</section>
    <section class="stack"><h2>Reports to review (${reports.length})</h2>${reports.length ? reports.map((r) => { const nm = r.type === "educator" ? ((EDU.find((e) => e.id === r.targetId) || (st.myProfile ? { name: st.myProfile.name } : {})).name) : (st.jobs.find((j) => j.id === r.targetId) || {}).title; return `<div class="card flat stack"><p class="small muted">${r.type} · reason: <b>${h(r.reason)}</b></p><p class="bold">${h(nm)}</p>${r.details ? `<p>${h(r.details)}</p>` : ""}<p class="small muted">Reported by ${h(r.by)}. The reported person is never told who.</p><div class="row"><button class="btn btn-primary" data-act="suspend" data-v="${r.id}">${r.type === "educator" ? "Hide the profile (suspend)" : "Remove the job post"}</button><button class="btn" data-act="dismiss" data-v="${r.id}">Dismiss</button></div></div>`; }).join("") : `<div class="card flat">No reports waiting.</div>`}</section>
    ${sus.length ? `<section class="stack"><h2>Suspended right now</h2>${sus.map((id) => `<div class="card flat row" style="justify-content:space-between"><span><b>${h((EDU.find((e) => e.id === id) || { name: id }).name)}</b> <span class="small muted">educator profile</span></span><button class="btn" data-act="reinstate" data-v="${id}">Reinstate</button></div>`).join("")}</section>` : ""}
    <section class="stack"><h2>Memberships (${st.memberships.length})</h2>${st.memberships.length ? `<div class="scroll-x"><table class="tbl"><thead><tr><th>Holder</th><th>Kind</th><th>Starts</th><th>Ends</th></tr></thead><tbody>${st.memberships.map((x) => `<tr><td>${h(who(x.holder))}</td><td>${x.schoolId ? h(SCHOOLS.find((s) => s.id === x.schoolId).name) : "Family"}</td><td>${x.start}</td><td>${x.end}</td></tr>`).join("")}</tbody></table></div>` : `<div class="card flat">None yet.</div>`}</section></div>`;
};

/* ================= shell ================= */
const ROLES = [["visitor", () => T("Visitor", "訪客")], ["family", () => T("Family", "家庭")], ["school", () => T("School", "學校")], ["educator", () => T("Educator", "教師")], ["admin", () => "Admin"]];
function navItems() {
  const m = me();
  if (!m) return [["home", T("Home", "首頁")], ["educators", T("Find educators", "尋找教師")]];
  if (m.type === "family") return [["dashboard", T("Dashboard", "儀表板")], ["educators", T("Find educators", "尋找教師")]];
  if (m.type === "school") return [["dashboard", T("Dashboard", "儀表板")], ["educators", T("Find educators", "尋找教師")], ["campuses", T("My campuses", "我的校區")], ["myjobs", T("Jobs", "職缺")]];
  if (m.type === "educator") return [["dashboard", T("Dashboard", "儀表板")], ["profile", T("My profile", "我的檔案")], ["jobs", T("Job posts", "職缺")]];
  return [["admin", "Admin desk"]];
}
const GROUP = { join: "dashboard", order: "dashboard", ecpay: "dashboard", educator: "educators", jobnew: "myjobs", report: "dashboard", signup: "home" };
function shell(inner) {
  const cur = GROUP[st.view] || st.view;
  return `<div class="demo"><div class="wrap"><b>${T("DEMO", "示範")}</b><span>${T("Pretend people and data. Nothing is saved on a server and no money moves.", "虛構的人物與資料。沒有任何資料存到伺服器，也沒有任何款項移動。")}</span>
      <span class="chips" role="group" aria-label="${T("Try the site as", "以此身分試用")}">${ROLES.map(([k, l]) => `<button class="chip" data-act="role" data-v="${k}" aria-pressed="${st.role === k}">${l()}</button>`).join("")}</span><button class="link" data-act="reset">${T("Start over", "重新開始")}</button></div></div>
    <div class="wrap"><header class="top"><button class="brand" data-act="nav" data-v="${me() ? "dashboard" : "home"}">${MARK}<span>LearningLinks</span></button><nav class="nav" aria-label="${T("Main", "主要")}">${navItems().map(([v, l]) => `<button data-act="nav" data-v="${v}" ${cur === v ? 'aria-current="page"' : ""}>${l}</button>`).join("")}</nav>
      <div class="lang" role="group" aria-label="Language"><button data-act="lang" data-v="zh" aria-pressed="${st.lang === "zh"}">繁中</button><button data-act="lang" data-v="en" aria-pressed="${st.lang === "en"}">EN</button></div>${me() ? `<button class="btn" data-act="signout">${T("Sign out", "登出")}</button>` : `<button class="btn btn-primary" data-act="start" data-v="">${T("Sign up", "註冊")}</button>`}</header>
    <main id="main">${inner}</main>
    <footer class="fine"><div class="notice" role="note"><b>${h(noticeFull().lead)}</b> ${h(noticeFull().full)}</div><div class="links"><span>${T("In the real site: Terms, Privacy policy and Educator waiver (drafts, to be reviewed by your lawyer), Safety guide.", "真實網站中：服務條款、隱私權政策、教師刊登同意書（草稿，待律師審閱）、安全指南。")}</span></div></footer></div>${st.toast ? `<div class="toast" role="status">${h(st.toast)}</div>` : ""}`;
}

function render(scrollTop) {
  const a = document.activeElement;
  const aid = a && a.id, ss = a && a.selectionStart, se = a && a.selectionEnd;
  const y = window.scrollY;
  const fn = V[st.view] || V.home;
  let inner;
  try { inner = fn(); } catch (err) { console.error(err); inner = `<div class="card">Something went wrong in this demo screen. <button class="btn" data-act="reset">Start over</button></div>`; }
  document.getElementById("app").innerHTML = shell(inner);
  document.title = "LearningLinks demo";
  document.documentElement.lang = st.lang === "zh" ? "zh-Hant-TW" : "en";
  if (aid) { const el = document.getElementById(aid); if (el) { el.focus({ preventScroll: true }); try { if (ss != null) el.setSelectionRange(ss, se); } catch (e) { /* not a text field */ } } }
  window.scrollTo(0, scrollTop ? 0 : y);
}

/* ================= people and presets ================= */
const DEFAULT_NAME = { family: "Demo Family", school: "Demo School", educator: "Demo Educator", admin: "Demo Admin" };
function clearPerson(type) {
  const id = "p-" + type;
  st.orders = st.orders.filter((o) => o.by !== id);
  st.memberships = st.memberships.filter((x) => x.holder !== id);
  Object.keys(st.owners).forEach((k) => { if (st.owners[k] === id) delete st.owners[k]; });
  st.reveals = st.reveals.filter((r) => r.by !== id);
  st.jobs = st.jobs.filter((j) => !j.mine || st.owners[j.schoolId]);
  if (type === "educator") st.myProfile = null;
}
function makePerson(type, name) { clearPerson(type); st.people[type] = { id: "p-" + type, type, name: name || DEFAULT_NAME[type] }; st.role = type; }
function payNow(o) { settle(o, "demo"); }
function preset(name) {
  if (name === "family_paid") { makePerson("family", "Mei"); const o = newOrder("family", [], "ecpay", null); payNow(o); go("educators"); }
  else if (name === "school_paid") { makePerson("school", "Sunny"); st.owners.s1 = "p-school"; st.owners.s2 = "p-school"; const o = newOrder("school", ["s1"], "ecpay", null); payNow(o); go("dashboard"); }
  else if (name === "educator") {
    makePerson("educator", "Lin");
    st.myProfile = { published: true, openTo: ["full_time", "private_tutoring"], city: "taichung", district: "taichung:xitun", subjects: ["english-conversation", "phonics"], levels: ["kindergarten", "elementary"], name: "Lin", head: "Friendly English teacher for young learners", bio: "I love songs, stories and games in class. Six years of teaching in Taichung.", rateMin: 700, rateMax: 1100, wish: "Kindergarten or cram school, afternoons", email: "lin@example.invalid", line: "lin-line", langs: ["en"], exp: "5-9" };
    go("dashboard");
  } else if (name === "admin") { makePerson("admin"); go("admin"); }
}

/* ================= actions ================= */
const A = {
  nav: (el) => { const v = el.dataset.v; if (v === "profile") return openProfile(); if (v === "dashboard" && !me()) return go("home"); go(v); },
  lang: (el) => { st.lang = el.dataset.v; save(); render(false); },
  reset: () => { st = fresh(); save(); render(true); },
  role: (el) => { const v = el.dataset.v; if (v === "visitor") { st.role = "visitor"; return go("home"); } if (!st.people[v]) { st.people[v] = { id: "p-" + v, type: v, name: DEFAULT_NAME[v] }; } st.role = v; go(v === "admin" ? "admin" : "dashboard"); },
  signout: () => { st.role = "visitor"; go("home"); },
  start: (el) => { const v = el.dataset.v; go("signup"); st.form.role = v || ""; render(true); },
  preset: (el) => preset(el.dataset.v),
  pick: (el) => { st.form[el.dataset.k] = el.dataset.v; render(false); },
  toggle: (el) => { const k = el.dataset.k, v = el.dataset.v; const a = st.form[k] || []; st.form[k] = a.includes(v) ? a.filter((x) => x !== v) : a.concat(v); render(false); },
  togglePick: (el) => { const a = st.form.picked || []; const v = el.dataset.v; st.form.picked = a.includes(v) ? a.filter((x) => x !== v) : a.concat(v); render(false); },
  city: (el) => { st.form.city = st.form.city === el.dataset.v ? "" : el.dataset.v; st.form.pin = ""; render(false); },
  pin: (el) => { st.form.pin = st.form.pin === el.dataset.v ? "" : el.dataset.v; render(false); },
  clearJobs: () => { st.form.city = ""; st.form.pin = ""; render(false); },
  back: () => go(st.prev ? st.prev.view : "dashboard", st.prev ? st.prev.args : {}),

  signup1: () => { st.form.step = 2; render(true); },
  signupBack: () => { st.form.step = (st.form.step || 2) - 1; render(true); },
  signup2: () => { st.form.step = 3; render(true); },
  signup3: () => { const role = st.form.role, name = (st.form.name || "").trim(); makePerson(role, name); toast(T("Account created. Welcome!", "帳號已建立，歡迎！")); go("dashboard"); },

  join: (el) => go("join", { type: el.dataset.v }),
  joinNext: () => { st.form.step = (st.form.step || 1) + 1; render(true); },
  joinBack: () => { st.form.step = (st.form.step || 2) - 1; render(true); },
  placeOrder: () => {
    const type = st.args.type, f = st.form;
    const campusIds = type === "school" ? (f.picked || []) : [];
    const invoice = f.inv === "company" ? { tax: f.tax, title: f.title } : null;
    const o = newOrder(type, campusIds, f.method || "ecpay", invoice);
    go("order", { id: o.id });
  },
  order: (el) => go("order", { id: el.dataset.v }),
  cancelOrder: (el) => { const o = st.orders.find((x) => x.id === el.dataset.v); if (o && o.status === "pending") o.status = "cancelled"; toast(T("Order cancelled.", "訂單已取消。")); go("dashboard"); },
  toEcpay: (el) => go("ecpay", { id: el.dataset.v, m: el.dataset.m }),
  ecpayPay: (el) => { const o = st.orders.find((x) => x.id === el.dataset.v); settle(o, "system:ecpay"); toast(T("Payment received. In the real site ECPay tells our server, and your membership starts by itself.", "已收到付款。在真實網站中，綠界會通知我們的伺服器，您的會員資格會自動開始。")); go("order", { id: o.id }); },
  ecpayNumber: (el) => { const o = st.orders.find((x) => x.id === el.dataset.v); const k = el.dataset.m; const exp = addMonths(TODAY, 0).replace(/-\d\d$/, "-" + String(Math.min(28, Number(TODAY.slice(8)) + 3)).padStart(2, "0")); o.info = k === "ATM" ? { kind: "ATM", bank: "812", account: "9103" + String(Math.floor(Math.random() * 1e12)).padStart(12, "0"), expire: exp } : { kind: "CVS", code: "LLL" + String(Math.floor(Math.random() * 1e11)).padStart(11, "0"), expire: exp }; go("order", { id: o.id }); },
  simulateNotice: (el) => { const o = st.orders.find((x) => x.id === el.dataset.v); settle(o, "system:ecpay"); toast(T("Pretend notice received: membership started.", "已收到模擬通知：會員資格已開始。")); go("order", { id: o.id }); },
  adminAsk: () => { st.people.admin = st.people.admin || { id: "p-admin", type: "admin", name: DEFAULT_NAME.admin }; st.role = "admin"; go("admin"); },

  claim: (el) => { st.owners[el.dataset.v] = pid(); save(); toast(T("Campus claimed. (The real site asks an administrator to approve this.)", "已認領校區。（真實網站會由管理員審核。）")); render(false); },
  jobPublish: () => {
    const f = st.form; const paid = ownedCampuses(pid()).filter((s) => campusActive(pid(), s.id));
    st.jobs.push({ id: uid("j"), mine: true, schoolId: f.campus || paid[0].id, title: f.title.trim(), type: f.jtype || "full_time", subject: f.subject || "english-conversation", desc: f.desc.trim(), contact: f.contact.trim(), status: "open" });
    toast(T("Job post published. Signed-in educators with a profile can see it.", "職缺已發布。已登入且有檔案的教師可以看到。")); go("myjobs");
  },
  closeJob: (el) => { const j = st.jobs.find((x) => x.id === el.dataset.v); if (j) j.status = "closed"; render(false); },

  viewEdu: (el) => { st.prev = { view: st.view, args: st.args }; go("educator", { id: el.dataset.v }); },
  reveal: (el) => {
    const m = me(); const id = el.dataset.v;
    if (st.reveals.some((r) => r.eduId === id && r.by === m.id)) return render(false);
    if (st.reveals.filter((r) => r.by === m.id && r.day === TODAY).length >= REVEAL_CAP) return toast(T("You have reached today's limit.", "您已達今日上限。"));
    st.reveals.push({ eduId: id, by: m.id, byType: m.type, byName: m.name, day: TODAY }); save(); render(false);
  },
  reportOpen: (el) => { st.prev = { view: st.view, args: st.args }; go("report", { t: el.dataset.t, id: el.dataset.v }); },
  reportSubmit: () => { st.reports.push({ id: uid("r"), type: st.args.t, targetId: st.args.id, reason: st.form.reason || "misleading", details: st.form.details || "", by: me() ? me().type : "visitor", status: "open" }); toast(T("Report sent to an administrator. Thank you.", "檢舉已送交管理員，謝謝您。")); go(st.prev ? st.prev.view : "dashboard", st.prev ? st.prev.args : {}); },

  hideProfile: () => { st.myProfile.published = false; toast(T("Profile hidden.", "檔案已隱藏。")); go("dashboard"); },
  profNext: () => { st.form.step = (st.form.step || 1) + 1; render(true); },
  profBack: () => { st.form.step = (st.form.step || 2) - 1; render(true); },
  profPublish: () => {
    const f = st.form;
    st.myProfile = { published: true, openTo: f.open, city: f.city, district: f.district || null, subjects: f.subjects, levels: f.levels, name: f.name.trim(), head: f.head.trim(), bio: f.bio.trim(), rateMin: Number(f.rateMin) || null, rateMax: Number(f.rateMax) || null, wish: f.wish, email: f.email.trim(), line: f.line, langs: ["en"], exp: "2-4" };
    toast(T("Your profile is published.", "您的檔案已發布。")); go("dashboard");
  },

  adminConfirm: (el) => {
    const o = st.orders.find((x) => x.id === el.dataset.v); const amt = Number(String(st.form["amt-" + o.id] ?? o.amount).replace(/[,\s]/g, ""));
    if (amt !== o.amount) { st.form.adminMsg = "The amount does not match the order total. Check the bank statement; a short payment is not confirmed."; st.form.adminOk = false; return render(false); }
    settle(o, "admin"); st.form.adminMsg = `Confirmed ${o.ref}. The membership has started and the buyer has been emailed.`; st.form.adminOk = true; save(); render(false);
  },
  markChecked: (el) => { const r = st.payReview.find((x) => x.id === el.dataset.v); if (r) r.done = true; render(false); },
  suspend: (el) => { const r = st.reports.find((x) => x.id === el.dataset.v); r.status = "actioned"; if (r.type === "educator") st.suspended[r.targetId] = true; else st.removedJobs[r.targetId] = true; save(); render(false); },
  dismiss: (el) => { const r = st.reports.find((x) => x.id === el.dataset.v); r.status = "dismissed"; save(); render(false); },
  reinstate: (el) => { delete st.suspended[el.dataset.v]; save(); render(false); },
};

/* ================= events ================= */
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act];
  if (fn) { e.preventDefault(); fn(el, e); save(); }
});
document.addEventListener("keydown", (e) => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('[role="button"][data-act]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); }
});
function onField(e) {
  const el = e.target;
  if (!el.dataset || !el.dataset.f) return;
  st.form[el.dataset.f] = el.type === "checkbox" ? el.checked : el.value;
  if (el.type === "checkbox" || el.tagName === "SELECT" || el.dataset.r || e.type === "input") render(false);
}
document.addEventListener("input", onField);
document.addEventListener("change", (e) => { if (e.target.type === "checkbox" || e.target.tagName === "SELECT") onField(e); });

render(true);

</script>
</body>
</html>
